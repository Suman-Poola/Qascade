[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qascade"
dynamic = ["version"]
description = "Gradient boosting of small quantum convolutional neural networks, with a scikit-learn API on Qiskit primitives."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Suman Poola", email = "spoola@imsa.edu" }]
maintainers = [{ name = "Suman Poola", email = "spoola@imsa.edu" }]
keywords = [
    "quantum machine learning",
    "gradient boosting",
    "quantum convolutional neural network",
    "qiskit",
    "scikit-learn",
    "ensemble learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.6",
    "joblib>=1.3",
    "qiskit>=2.0",
]

[project.optional-dependencies]
aer = ["qiskit-aer>=0.17"]
ibm = ["qiskit-ibm-runtime>=0.40"]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.5",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.40",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-jupyter>=0.25",
    "matplotlib>=3.8",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.40",
]
dev = [
    "qascade[test,docs]",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4",
    "build>=1.2",
    "twine>=6",
    "scipy-stubs; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/Suman-Poola/Qascade"
Documentation = "https://qascade.readthedocs.io"
Repository = "https://github.com/Suman-Poola/Qascade"
Issues = "https://github.com/Suman-Poola/Qascade/issues"
Changelog = "https://github.com/Suman-Poola/Qascade/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/qascade/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qascade"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff", "/pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "slow: slower tests (deselect with -m 'not slow')",
    "aer: needs qiskit-aer",
    "ibm: needs qiskit-ibm-runtime (fake backends only, no network)",
]
filterwarnings = ["error::DeprecationWarning:qascade.*"]

[tool.coverage.run]
source = ["qascade"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RUF", "D", "NPY", "PERF"]
ignore = [
    "D105", # magic-method docstrings
    "D107", # __init__ docstrings (parameters are documented on the class)
    "N803", # sklearn convention: X is upper case
    "N806",
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N802"]
"benchmarks/**" = ["D"]
"docs/**" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/qascade"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "qiskit.*", "qiskit_aer.*", "qiskit_ibm_runtime.*", "scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"
